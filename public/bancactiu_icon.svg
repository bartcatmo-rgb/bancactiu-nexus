<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for App Icon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- Primary Teal / Emerald Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Energetic Coral / Amber Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Dynamic Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Inner Soft Border -->
  <rect x="18" y="18" width="476" height="476" rx="106" ry="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Center Group with Glow -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    
    <!-- Outer Supportive Care Arc (Circular Community Loan Loop) -->
    <path d="M -110,40 C -150,-30 -110,-120 -20,-140 C 50,-155 120,-110 140,-40" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Active Mobility & Rehabilitation Curve (Intertwined Step / Stride) -->
    <path d="M -130,50 C -100,140 20,165 90,120 C 145,85 155,10 125,-60" 
          fill="none" 
          stroke="url(#tealGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Energetic Vitality & Active Forward Motion (Orange Arc) -->
    <path d="M -40,-30 C 10,-80 80,-40 60,30 C 45,85 -40,110 -60,60" 
          fill="none" 
          stroke="url(#coralGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- Head / Vitality Beacon (Active Human Head) -->
    <circle cx="20" cy="-60" r="28" fill="url(#coralGrad)" />
    
    <!-- Spark of Independence / Autonomy -->
    <circle cx="95" cy="-105" r="14" fill="#2DD4BF" />
  </g>
</svg>
