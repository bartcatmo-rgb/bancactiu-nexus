<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="proBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="proShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#proBg)" stroke="#334155" stroke-width="4" />

  <!-- Geometric Network Nodes with Circular Loop -->
  <g transform="translate(256, 256)" filter="url(#proShadow)">
    <!-- Circular Technical Orbit Arrow -->
    <path d="M -130,-40 A 140 140 0 1 1 120 70" fill="none" stroke="url(#blueGlow)" stroke-width="26" stroke-linecap="round" />
    <!-- Arrowhead on orbit -->
    <polygon points="120,40 145,85 95,85" fill="#38BDF8" />

    <!-- Connected Geometric Network Nodes -->
    <line x1="-70" y1="-50" x2="60" y2="-50" stroke="#94A3B8" stroke-width="8" stroke-dasharray="8 6" />
    <line x1="-70" y1="-50" x2="0" y2="60" stroke="#94A3B8" stroke-width="8" />
    <line x1="60" y1="-50" x2="0" y2="60" stroke="#94A3B8" stroke-width="8" />

    <!-- Central & Peripheral Nodes -->
    <circle cx="-70" cy="-50" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="8" />
    <circle cx="60" cy="-50" r="24" fill="#1E293B" stroke="#2563EB" stroke-width="8" />
    <circle cx="0" cy="60" r="30" fill="#2563EB" stroke="#FFFFFF" stroke-width="6" />

    <!-- Inner Core Dot -->
    <circle cx="0" cy="60" r="10" fill="#FFFFFF" />
  </g>
</svg>
