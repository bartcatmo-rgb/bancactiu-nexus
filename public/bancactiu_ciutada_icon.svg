<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ciutadaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="ciutadaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D9488" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#ciutadaBg)" stroke="#115E59" stroke-width="4" />

  <!-- Two Geometric Hands in Semicircle Embracing a Support Point -->
  <g transform="translate(256, 256)" filter="url(#ciutadaGlow)">
    <!-- Left Hand Arc (Support Embrace) -->
    <path d="M -140,40 C -150,-40 -110,-120 -20,-130 C -20,-130 -10,-90 -60,-60 C -100,-35 -100,30 -70,70 Z" 
          fill="url(#tealGrad)" opacity="0.95" />

    <!-- Right Hand Arc (Solidarity Embrace) -->
    <path d="M 140,40 C 150,-40 110,-120 20,-130 C 20,-130 10,-90 60,-60 C 100,-35 100,30 70,70 Z" 
          fill="url(#emeraldGrad)" opacity="0.95" />

    <!-- Lower Cradle Base Curve -->
    <path d="M -110,60 C -60,140 60,140 110,60 C 70,110 -70,110 -110,60 Z" 
          fill="#14B8A6" />

    <!-- Central Geometric Support Point (Solidarity Core) -->
    <circle cx="0" cy="-20" r="32" fill="#F8FAFC" stroke="#0D9488" stroke-width="8" />
    <circle cx="0" cy="-20" r="14" fill="#0D9488" />

    <!-- Radiant Beacon Spark -->
    <polygon points="0,-75 6,-55 24,-55 10,-42 15,-25 0,-36 -15,-25 -10,-42 -24,-55 -6,-55" fill="#5EEAD4" />
  </g>
</svg>
